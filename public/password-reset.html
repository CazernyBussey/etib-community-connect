<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Request Password Reset | ETIB Directory</title>
  <meta name="description" content="Request a secure ETIB Community Connect password reset link." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="index.html">
        <img src="assets/etib-logo.webp" alt="" width="427" height="512" />
        <span class="brand-text"><strong>ETIB Community Connect Directory</strong></span>
      </a>
      <nav class="site-nav" aria-label="Directory site navigation">
        <ul id="siteNavList">
          <li><a href="index.html">Directory</a></li>
          <li><a href="login.html">Sign In</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <section class="container">
      <div class="panel section-panel" style="margin-top:18px; max-width:720px;">
        <h1>Request a password reset</h1>
        <p>Enter your account email. If the account exists, ETIB will send a secure, one-time reset link.</p>
        <form class="form-layout" id="forgot-password-form" aria-describedby="forgot-help forgot-status">
          <p id="forgot-help" class="field-help">Enter the same email address you use to sign in.</p>
          <div class="field">
            <label for="forgot-email">Email <span class="req">*</span></label>
            <input id="forgot-email" name="email" type="email" autocomplete="email" maxlength="254" required />
          </div>
          <div class="cta-row">
            <button class="btn btn-primary" type="submit">Send Reset Link</button>
            <a class="btn" href="login.html">Back to Sign In</a>
          </div>
          <p id="forgot-status" class="small" data-status role="status" aria-live="polite" aria-atomic="true"></p>
        </form>
      </div>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
