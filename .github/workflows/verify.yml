name: Verify directory

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Accessibility and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Run verification suite
        run: npm test

      - name: Audit dependencies
        run: |
          for attempt in 1 2 3; do
            if npm audit; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "npm audit failed after 3 attempts."
              exit 1
            fi
            echo "npm audit endpoint was unavailable; retrying attempt $((attempt + 1)) of 3."
            sleep $((attempt * 5))
          done
