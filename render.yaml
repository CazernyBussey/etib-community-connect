services:
  - type: web
    name: etib-community-connect
    env: node
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    disks:
      - name: etib-data
        mountPath: /var/data
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24.14.0"
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: https://etib-community-connect-1.onrender.com/
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        value: ETIB Administrator
      - key: ADMIN_PHONE
        sync: false
      - key: AUTH_RATE_WINDOW_MS
        value: "900000"
      - key: AUTH_RATE_MAX
        value: "10"
      - key: PASSWORD_RESET_WINDOW_MINUTES
        value: "60"
      - key: DB_PATH
        value: /var/data/etib.db
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
