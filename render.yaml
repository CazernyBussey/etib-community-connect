services:
  - type: web
    name: etib-community-connect
    env: node
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    disks:
      - name: etib-data
        mountPath: /var/data
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24.14.0"
